name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-x86:
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Verify ProcessEvent bridge layout
        shell: pwsh
        run: .\tools\Test-ProcessEvent-Bridge-Layout.ps1

      - name: Build Debug x86
        shell: pwsh
        run: msbuild AliceCoop.sln /m /t:Rebuild "/p:Configuration=Debug;Platform=x86"

      - name: Build Release x86
        shell: pwsh
        run: msbuild AliceCoop.sln /m /t:Rebuild "/p:Configuration=Release;Platform=x86"

      - name: Unit tests
        shell: pwsh
        run: .\bin\Release\AliceCoopTests.exe

      - name: Relay self-test
        shell: pwsh
        run: .\bin\Release\AliceCoopServer.exe --self-test

      - name: Launcher self-test
        shell: pwsh
        run: |
          $process = Start-Process .\bin\Release\AliceCoopLauncher.exe `
            -ArgumentList '--self-test' -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw 'AliceCoopLauncher self-test failed.'
          }

      - name: Protocol version query
        shell: pwsh
        run: |
          $output = & .\bin\Release\AliceCoopServer.exe --protocol-version
          if ($LASTEXITCODE -ne 0 -or $output -notmatch '^\d+$') {
            throw 'Invalid protocol-version response.'
          }

      - name: Build and verify packages
        shell: pwsh
        run: |
          .\tools\Build-AliceCoop-Package.ps1 -Version 0.0.0-ci -SkipBuild -RequireCleanSource
          .\tools\Test-AliceCoop-Package.ps1 -Version 0.0.0-ci -RequireCleanSource

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: AliceCoop-windows-x86
          if-no-files-found: error
          path: |
            bin/Release/dinput8.dll
            bin/Release/AliceCoopServer.exe
            bin/Release/AliceCoopLauncher.exe
