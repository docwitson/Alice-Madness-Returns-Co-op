name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-x86:
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build Release x86
        shell: pwsh
        run: msbuild AliceCoop.sln /m /t:Build "/p:Configuration=Release;Platform=x86"

      - name: Relay self-test
        shell: pwsh
        run: .\bin\Release\AliceCoopServer.exe --self-test

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: AliceCoop-windows-x86
          if-no-files-found: error
          path: |
            bin/Release/dinput8.dll
            bin/Release/AliceCoopServer.exe
