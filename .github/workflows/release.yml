name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Package version without the v prefix
        required: true
        default: 0.1.0-alpha.3

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-2022
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Resolve version
        id: version
        shell: pwsh
        env:
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          RELEASE_REF_NAME: ${{ github.ref_name }}
          RELEASE_INPUT_VERSION: ${{ inputs.version }}
        run: |
          if ($env:RELEASE_REF_TYPE -eq "tag") {
            $version = $env:RELEASE_REF_NAME -replace '^v', ''
          } else {
            $version = $env:RELEASE_INPUT_VERSION
          }
          if ($version -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z][0-9A-Za-z.-]*)?$') {
            throw "Invalid release version: $version"
          }
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "value=$version" -Encoding utf8

      - name: Verify native integration
        shell: pwsh
        run: |
          .\tools\Test-ProcessEvent-Bridge-Layout.ps1
          python .\tools\Test-Coop-Scaleform-Actions.py

      - name: Build packages
        shell: pwsh
        run: .\tools\Build-AliceCoop-Package.ps1 -Version "${{ steps.version.outputs.value }}" -RequireCleanSource

      - name: Verify packages
        shell: pwsh
        run: .\tools\Test-AliceCoop-Package.ps1 -Version "${{ steps.version.outputs.value }}" -RequireCleanSource

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: AliceCoop-${{ steps.version.outputs.value }}
          if-no-files-found: error
          path: |
            artifacts/deploy/*.zip
            artifacts/deploy/*-SHA256SUMS.txt

      - name: Create draft GitHub release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: |
          $assets = Get-ChildItem -LiteralPath artifacts/deploy -File |
            Where-Object { $_.Name -like '*.zip' -or $_.Name -like '*-SHA256SUMS.txt' } |
            ForEach-Object FullName
          if ($assets.Count -ne 3) {
            throw "Expected two ZIP archives and one checksum file; found $($assets.Count)."
          }
          $notes = "docs/RELEASE_NOTES_$($env:RELEASE_VERSION).md"
          if (-not (Test-Path -LiteralPath $notes -PathType Leaf)) {
            throw "Release notes are missing: $notes"
          }
          gh release create $env:RELEASE_TAG @assets `
            --title "Alice Co-op $($env:RELEASE_VERSION)" `
            --notes-file $notes `
            --verify-tag --draft --latest
          if ($LASTEXITCODE -ne 0) { throw 'GitHub draft release creation failed.' }
