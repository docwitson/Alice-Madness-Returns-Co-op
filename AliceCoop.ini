[Network]
; BAT scripts enable AliceCoop and supply a per-process role automatically.
; For a normal Steam launch, set this to 1 and set Role explicitly below.
EnableWithoutLauncher = 0
Role =
ServerAddress = 127.0.0.1
Port = 27018
SendRateHz = 30
PeerTimeoutMs = 3000

[VisualProxy]
Enabled = 1
; One-process diagnostic: duplicate the local Alice and let UE3 copy the
; evaluated skeleton through ParentAnimComponent. The manual mirror script
; enables this through the environment; keep it off for normal host/client.
LocalMirror = 0
MirrorDistance = 160
DisableCollision = 1
InterpolationSpeed = 18
; Extra local-space calibration for the independent remote hair simulation.
; Values are degrees and are read when each game process starts. This makes
; orientation experiments possible without rebuilding AliceCoop.
HairRotationX = 180
HairRotationY = 265
HairRotationZ = 0
; Runtime tuning starts on target 3 (HairComponent + HairActor), which is the
; transform path consumed by Alice's custom hair renderer.
HairRotationTarget = 3
HairOffsetX = -0.2
HairOffsetY = 0.0
HairOffsetZ = -2.2
; Runtime hair hotkeys and the experimental overlay are disabled after
; calibration. Set to 1 only when another tuning pass is needed.
HairTuningEnabled = 0
; Optional cosmetic history for the proxy's double-jump/glide particles.
; It can also be changed from the in-game pause overlay.
PreserveMovementTrails = 0

[Trace]
; One-process instrumentation mode. AliceCoop-Trace.bat enables it through
; the environment, so keep this off for normal host/client and mirror runs.
Enabled = 0
; Broader ProcessEvent logging remains active this long after a state change
; or input action. High-signal SpecialMove/weapon events are always captured.
EventWindowMs = 2500
; Focused live diagnostics for arena experiments. This keeps normal co-op
; running and records only nearby enemies, breakables and pickups plus their
; meaningful state transitions.
WorldEnabled = 0
WorldRadius = 10000
; Focused lifecycle diagnostics. Unlike the legacy action trace these do not
; disable networking or normal co-op replication.
VfxLifecycleEnabled = 0
AnimationLifecycleEnabled = 0
AnimationComparisonEnabled = 0
ControlLifecycleEnabled = 0
; Passive lifecycle checks. Violations are logged as [CoopInvariant] records;
; no game state is modified or repaired.
InvariantEnabled = 0

[SharedWorld]
; First host-authoritative world layer: damage dealt to matched ordinary
; enemies is relayed through the host and their resulting HP/death is
; reconciled on the client.
EnemyHealth = 1
; Experimental second layer: the host streams the transforms of its nearest
; enemies. The client pauses matched local AI and quarantines premature
; client-only encounter spawns until the host advertises the same stable key.
EnemyTransforms = 1
EnemyPositionRadius = 12000
; Client correction strength for host-authoritative enemy poses. Corrections
; below the snap distance are smoothed; larger divergences snap immediately.
EnemyCorrectionSpeed = 22
EnemySnapDistance = 1200
; Development convenience for AliceCoop-Both.bat. When enabled, the Alice
; belonging to the non-foreground game window ignores incoming enemy damage.
; Normal host/client sessions leave this disabled.
BackgroundWindowDamageGuard = 0

[Window]
; Manual launch scripts request windowed mode through the process environment.
ForceWindowed = 0
; Optional legacy window positioning/sizing. Keep disabled for manual launch.
ManageGeometry = 0
X = 0
Y = 0
Width = 960
Height = 540

[Performance]
; The stock MadnessPatch high-resolution texture options are disabled only in
; BAT-launched co-op processes to keep two game instances within reasonable limits.
LowMemoryMode = 1
MaxFPS = 60
MaxPoolThreads = 4

[Debug]
OnScreenStatus = 0
